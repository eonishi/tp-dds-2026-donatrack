name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify

  # Construye la imagen de cada módulo. En los PR solo verifica que el Dockerfile ande;
  # en main además la publica en GHCR para que la EC2 la baje sin compilar.
  docker:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - modulo: donaciones
            main_class: ar.edu.utn.donatrack.api.DonaTrackApplication
          - modulo: logistica
            main_class: ar.edu.utn.donatrack.logistica.MainLogistica
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            MODULO=${{ matrix.modulo }}
            MAIN_CLASS=${{ matrix.main_class }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/eonishi/donatrack-${{ matrix.modulo }}:latest
            ghcr.io/eonishi/donatrack-${{ matrix.modulo }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.modulo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.modulo }}

  # Solo con un push a main (o sea, al mergear): copia el compose a la EC2 y levanta las imágenes nuevas.
  deploy:
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Si llegan dos pushes seguidos, el segundo deploy espera al primero en vez de pisarlo
    # (pisarse deja contenedores renombrados a medias y el siguiente "up" falla).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/donatrack
      - uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_SMS_FROM: ${{ secrets.TWILIO_SMS_FROM }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,RESEND_API_KEY,RESEND_FROM,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_SMS_FROM,TWILIO_WHATSAPP_FROM
          script: |
            set -e
            cd ~/donatrack
            # Credenciales de notificaciones: salen de los GitHub Secrets y se escriben en un .env aparte
            # (solo legible por el usuario), así el .env principal que se creó a mano no se toca.
            # Si algún secret no está cargado, se deja el archivo anterior tal cual.
            if [ -n "$RESEND_API_KEY" ] && [ -n "$RESEND_FROM" ] && [ -n "$TWILIO_ACCOUNT_SID" ] \
               && [ -n "$TWILIO_AUTH_TOKEN" ] && [ -n "$TWILIO_SMS_FROM" ] && [ -n "$TWILIO_WHATSAPP_FROM" ]; then
              umask 077
              {
                printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
                printf 'RESEND_FROM=%s\n' "$RESEND_FROM"
                printf 'TWILIO_ACCOUNT_SID=%s\n' "$TWILIO_ACCOUNT_SID"
                printf 'TWILIO_AUTH_TOKEN=%s\n' "$TWILIO_AUTH_TOKEN"
                printf 'TWILIO_SMS_FROM=%s\n' "$TWILIO_SMS_FROM"
                printf 'TWILIO_WHATSAPP_FROM=%s\n' "$TWILIO_WHATSAPP_FROM"
              } > .env.notificaciones
            else
              echo "AVISO: faltan secrets de notificaciones en GitHub; se mantiene el .env.notificaciones anterior (si existe)."
            fi
            # Las imágenes son privadas (el repo lo es): login con el token del job, que vence al terminar.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
