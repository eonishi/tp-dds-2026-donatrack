services:
  donaciones:
    build:
      context: .
      args:
        MODULO: donaciones
        MAIN_CLASS: ar.edu.utn.donatrack.api.DonaTrackApplication
    env_file: .env
    environment:
      PORT: "7070"
      DB_SCHEMA: donaciones
    ports:
      - "7070:7070"
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  logistica:
    build:
      context: .
      args:
        MODULO: logistica
        MAIN_CLASS: ar.edu.utn.donatrack.logistica.MainLogistica
    env_file: .env
    environment:
      DB_SCHEMA: logistica
      DONACIONES_API_URL: http://donaciones:7070
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      donaciones:
        condition: service_started

  postgres:
    image: docker.io/library/postgres:18.6-alpine
    profiles: [local]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432" 
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
